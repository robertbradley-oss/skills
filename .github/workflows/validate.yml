name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Check out canonical Clean Handoff
        uses: actions/checkout@v7
        with:
          repository: robertbradley-oss/clean-handoff
          ref: 5a308ab7426cbf0b6b5f81f14b634b1b5b4ca0e6
          path: .canonical-clean-handoff
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate skill packages
        run: python .github/scripts/validate_skills.py
      - name: Run Simplify contract tests
        run: python -B -m unittest discover -s simplify-report/tests -p "test_*.py" -v
      - name: Verify canonical Clean Handoff bytes
        run: git diff --no-index --exit-code -- clean-handoff .canonical-clean-handoff/skills/clean-handoff
      - name: Check Clean Handoff JavaScript syntax
        shell: pwsh
        run: |
          Get-ChildItem -LiteralPath clean-handoff -Recurse -File -Filter '*.mjs' | Sort-Object FullName | ForEach-Object {
            node --check $_.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run Clean Handoff tests
        run: node --test clean-handoff/tests/*.test.mjs
      - name: Check Clean Handoff public help
        run: node clean-handoff/scripts/clean-handoff.mjs --help
      - name: Compile Post Clean helpers
        run: python -m py_compile post-clean/scripts/apply_cleanup.py post-clean/scripts/inspect_footprint.py
      - name: Run Post Clean tests
        run: python -B -m unittest discover -s post-clean/tests -p "test_*.py" -v
