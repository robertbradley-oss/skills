name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate skill packages
        run: python tools/validate_skills.py
      - name: Compile Post Clean helpers
        run: python -m py_compile post-clean/scripts/apply_cleanup.py post-clean/scripts/inspect_footprint.py
      - name: Run Post Clean tests
        run: python -B -m unittest discover -s tests/post-clean -p "test_*.py" -v
