name: Validate skills

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Install validation dependency
        run: python -m pip install --disable-pip-version-check PyYAML==6.0.3
      - name: Validate skill packages
        run: python .github/scripts/validate_skills.py
      - name: Run Simplify contract tests
        run: python -B -m unittest discover -s simplify-report/tests -p "test_*.py" -v
      - name: Run Clean Handoff tests
        run: node --test clean-handoff/tests/*.test.mjs
      - name: Compile Clean Up helpers
        run: python -m py_compile clean-up/scripts/analyze_file_organization.py clean-up/scripts/analyze_tracked_code.py clean-up/scripts/apply_cleanup.py clean-up/scripts/apply_git_hygiene.py clean-up/scripts/discover_repository.py clean-up/scripts/inspect_git_hygiene.py clean-up/scripts/inspect_repository.py clean-up/scripts/triage_repository.py
      - name: Run Clean Up tests
        run: python -B -m unittest discover -s clean-up/tests -p "test_*.py" -v
